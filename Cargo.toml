[workspace]
resolver = "2"
members = ["protocol", "doord", "door-greeter"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/satorisage/door"

[workspace.dependencies]
protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
