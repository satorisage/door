# door greeter theme — the packaged default, installed to
# /usr/share/door/greeter.toml. To customize, copy this to /etc/door/greeter.toml
# and edit; that path overrides this one. (A DOORD_GREETER_CONFIG=<path> env var
# overrides both, for testing.)
#
# Every key is optional and overlays a built-in default, so a partial file works.
# Colors are "#rrggbb" or "#rrggbbaa" — the card uses alpha for the translucent,
# glassy look over the wallpaper. An unknown key is a loud error, not silently
# ignored. A missing asset (wallpaper/logo) degrades to the solid background.

# Background image behind the card. Left unset by default: door draws the animated
# sky (twinkling stars + drifting comet + indigo glow) over the solid `background`,
# matching the desktop's animated comet plugin — cleaner than a static image.
# Uncomment to use a static image instead (e.g. the stylized comet PNG):
# wallpaper = "/usr/share/door/wallpaper.png"

# Tokyo Night palette.
background  = "#1a1b26"    # solid fill (wallpaper letterbox edges, or no wallpaper)
card        = "#16161ed8"  # the glassy login card — translucent (alpha d8 ≈ 85%)
field       = "#292e42"    # input fill, lifted slightly off the card
accent      = "#7aa2f7"    # focus highlight + the sign-in button
foreground  = "#c0caf5"    # primary text
muted       = "#565f89"    # date, placeholders, status, idle power controls

# Installed system-wide; falls back to the stock font if absent.
font = "MesloLGS Nerd Font"

corner_radius = 16.0       # card corner radius (px)
card_width    = 300.0      # card width (px) — keep it minimal
show_clock    = true       # show the clock + date in the card
# clock_seconds = false      # show seconds (HH:MM:SS / analog second hand)
# clock_size    = 56         # clock font size (px) — also the analog face scale
# clock_style   = "digital"  # "digital" readout or an "analog" clock face
# clock_format  = "%a %H:%M"  # custom strftime for the digital clock (unset = HH:MM)
# font_scale    = 1.0        # scale all card text (accessibility / large-text)
# font_weight   = "regular"  # card text weight: light | regular | medium | semibold | bold
# card_pos     = "center"   # card placement: center | left | right | top | bottom
# Animated sky: a twinkling Tokyo Night starfield + a drifting comet (a native
# port of the com.genny.tokyonightcomet Plasma wallpaper). false → still wallpaper.
animate       = true
# reduced_motion = false     # accessibility: still all motion (overrides the above)
# Global GPU budget — wraps the whole render (not per-scene). Bundles shader detail
# (fbm octaves), a frame-rate cap, and whether the frosted-card blur pass runs:
#   lite     = ½ detail, 30 fps, no blur   (weak iGPUs / battery)
#   moderate = trimmed detail, 60 fps, no blur
#   high     = full detail, 60 fps, blur on  (default — current look unchanged)
#   bonkers  = full detail, uncapped, blur on  (strong GPUs)
# gpu_level     = "high"
# Sky scene: "auto" (day/night by the clock, the default), "seasonal" (scene by the
# calendar — snow/winter, rain/spring, meteor/summer, fog/autumn), or a fixed scene.
# Scenes: "aurora", "storm", "rain", "snow", "meteor", "moon", "synthwave", "fog",
#         "plasma", "fire", "water".
# sky_mode      = "auto"
# Comet-spinner controls. glow = head bloom (0 = crisp; a bright bloom blends on a
# dark card but bands on a light one, so the day variant below defaults to 0).
# speed = rotation in rad/s. Both also have sliders in door-settings.
spinner_glow  = 1.0
spinner_speed = 2.5
spinner_comet = "#7dcfff"   # the rotating comet's color (head + trail)
spinner_track = "#7aa2f7"   # the static ring of dots it passes over
spinner_trail = 1.0         # trail length 0.15–1.0 (shorter = crisper on a light card)

# ── Expanded controls (all optional; defaults shown). Every one of these also has
# a widget in door-settings — run it with `--expert` to reveal the "Advanced" ones.
#
# Sky
# comet_color    = "#7dcfff"  # the background-sky comet (separate from the spinner)
# glow_color     = "#3d59a1"  # sky-glow tint (night haze / daytime sun-haze)
# sky_glow       = 0.5        # strength of that glow (0–2)
# star_density   = 0.47       # how many stars (0–1)
# star_twinkle   = 1.0        # twinkle-speed multiplier
# comet_enabled  = true       # the drifting background comet
# comet_interval = 9.5        # seconds between comet sweeps
# cloud_amount   = 1.0        # daytime cloud cover multiplier (day theme only)
# cloud_speed    = 1.0        # daytime cloud drift multiplier
# sun_x          = 0.24       # daytime sun position, 0–1 across (0 = left)
# sun_y          = 0.18       # daytime sun position, 0–1 down (0 = top)
# sun_size       = 0.25       # daytime sun halo radius (bigger = wider glow)
# sun_intensity  = 0.38       # daytime sun halo brightness (0–1; 0 = none)
# sun_color      = "#ffe8b0"  # daytime sun halo tint
# glow_x         = 0.5        # night sky-glow center, 0–1 across (0 = left)
# glow_y         = 0.44       # night sky-glow center, 0–1 down (0 = top)
# day_haze       = 0.25       # daytime horizon-haze strength (0–1)
# star_layers    = 3          # number of parallax star layers (1–5)
# star_size      = 1.0        # star size multiplier (bigger = larger)
# nebula_speed   = 1.0        # night nebula drift-speed multiplier
# comet_tilt     = 0.0        # rotate the sky-comet path (radians; 0 = diagonal)
# comet_pause    = 2.5        # pause (s) after each sky-comet sweep
# comet_width    = 1.0        # sky-comet width multiplier
# cloud_lit      = "#ffffff"  # daytime cloud sun-lit color
# cloud_shadow   = "#b4c2db"  # daytime cloud shadowed-underside color
# cursor_parallax = 1.0       # starfield drift with the mouse (0 = off)
# glow_pulse      = 0.0       # gentle breathing of the night sky-glow (0 = steady)
#
# Synthwave scene (only used when sky_mode = "synthwave"; door-settings shows these
# under a "Synthwave" group when that scene is selected):
# synthwave_grid_speed       = 1.2      # grid scroll speed toward the viewer
# synthwave_grid_density     = 0.55     # grid line spacing (higher = more lines)
# synthwave_grid_perspective = 0.6      # how wide the grid spreads toward the front
# synthwave_grid_glow        = 0.7      # neon grid brightness
# synthwave_sun_size         = 0.22     # sun radius (fraction of height)
# synthwave_sun_stripes      = 120      # sun dark-band frequency (0 = solid)
# synthwave_sun_bloom        = 0.25     # soft glow around the sun
# synthwave_horizon          = 0.56     # where ground meets sky (0 top … 1 bottom)
# synthwave_grid_color       = "#00e6ff" # neon grid colour
# synthwave_sky_top          = "#290d47" # upper-sky colour
# synthwave_sky_bottom       = "#f2458c" # lower-sky / sun-base colour
#
# Storm scene (only used when sky_mode = "storm"):
# storm_lightning_rate  = 0.8       # how often lightning may strike (per second)
# storm_strike_chance   = 0.32      # odds a given window actually flashes (0–1)
# storm_cloud_density   = 1.0       # how heavy the churning clouds read
# storm_bolt_color      = "#d9e6ff" # lightning bolt colour
# storm_flash_color     = "#8c99cc" # whole-sky flash colour
#
# Rain scene (only used when sky_mode = "rain"):
# rain_fall_speed   = 5.0        # how fast the streaks fall
# rain_density      = 0.07       # how many streaks fill the sky (0 = clear, ~0.3 = heavy)
# rain_slant        = 4.0        # diagonal lean (0 = straight down)
# rain_intensity    = 0.5        # streak brightness against the sky
# rain_color        = "#8c9eb8"  # rain streak colour
#
# Snow scene (only used when sky_mode = "snow"):
# snow_fall_speed   = 0.9        # how fast the flakes drift down
# snow_density      = 0.14       # how many flakes fill the sky (0 = clear, ~0.3 = heavy)
# snow_sway         = 0.6        # how much the flakes wander side to side
# snow_flake_size   = 18.0       # higher = smaller, finer flakes
# snow_color        = "#ffffff"  # flake colour
#
# Fire scene (only used when sky_mode = "fire"):
# fire_rise_speed   = 2.0        # how fast the flames scroll upward
# fire_flame_height = 0.22       # lower = taller flames reaching up the screen
# fire_flame_color  = "#ff4b0d"  # base flame hue (internally boosted for the hot glow)
# fire_tip_color    = "#ffe680"  # hot-tip colour
#
# Aurora scene (only used when sky_mode = "aurora"):
# aurora_speed      = 0.12       # how fast the curtains wave across the sky
# aurora_drop       = 3.2        # lower = longer curtains hanging down
# aurora_ray_freq   = 50.0       # vertical ray-striation frequency (shimmer)
# aurora_intensity  = 0.6        # overall curtain glow
# aurora_green      = "#2effa8"  # green curtain colour
# aurora_magenta    = "#9e4dff"  # magenta curtain colour
#
# Plasma scene (only used when sky_mode = "plasma"):
# plasma_speed      = 0.5        # how fast the plasma churns
# plasma_scale      = 8.0        # higher = finer, busier cells
# plasma_saturation = 0.5        # 0 = washed grey, 0.5 = full rainbow
# plasma_tint       = "#ffffff"  # tint multiplier (white = the raw rainbow)
#
# Water scene (only used when sky_mode = "water"):
# water_speed         = 0.6        # how fast the surface ripples move
# water_scale         = 5.0        # higher = finer, tighter ripples
# water_ripple        = 0.6        # domain-warp distortion of the caustics
# water_caustic       = 0.85       # brightness of the bright caustic web
# water_caustic_color = "#73f2ff"  # caustic web colour
# water_deep          = "#001f38"  # deep (top) water colour
# water_shallow       = "#004d6b"  # shallow (bottom) water colour
#
# Meteor scene (only used when sky_mode = "meteor"):
# meteor_speed      = 0.16       # base travel speed
# meteor_count      = 10         # how many shooting stars at once
# meteor_trail      = 26.0       # trail decay (higher = shorter, crisper streaks)
# meteor_intensity  = 1.0        # overall meteor brightness
# meteor_color      = "#d9ebff"  # meteor streak colour
# meteor_star_color = "#bfccff"  # background star colour
#
# Moon scene (only used when sky_mode = "moon"):
# moon_size         = 0.16       # moon disc radius
# moon_phase_speed  = 0.06       # phase/terminator drift speed (0 = frozen)
# moon_texture      = 0.18       # surface mottling ("maria") amount
# moon_halo         = 0.28       # soft-glow halo strength
# moon_color        = "#ededdb"  # moon disc colour
# moon_halo_color   = "#808cb8"  # halo colour
#
# Fog scene (only used when sky_mode = "fog"):
# fog_drift         = 0.02       # bank drift speed
# fog_scale         = 1.4        # higher = finer, wispier banks
# fog_thickness     = 0.45       # density of the banks
# fog_opacity       = 0.7        # how much the fog veils the sky
# fog_color         = "#a8b3c7"  # fog colour
# card_gradient  = 0.45       # vertical sheen on the card (0 = flat)
# grain          = 0.0        # film grain over the sky (0 = off)
# vignette       = 0.2        # darken the screen edges (0 = off)
# card_blur      = true       # frosted-glass backdrop blur behind the card
#
# Spinner / card / behavior
# spinner_size   = 52.0       # card spinner diameter (px)
# spinner_pulse  = 1.0        # spinner head breathing speed (0 = steady)
# spinner_orbit  = 0.30       # comet orbit radius within the spinner (0.1–0.45)
# spinner_style  = "comet"    # emblem: comet | ring | dots | pulse | none (hide it)
# card_shadow_blur    = 34.0  # card drop-shadow blur (px)
# card_shadow_opacity = 0.45  # card drop-shadow darkness (0–1)
# accent_breathing    = 1.0   # card accent-edge pulse speed (0 = steady)
# field_radius   = 10.0       # input/button corner radius (px)
# error_color    = "#f7768e"  # status-line color on a failed login
# logo_box       = "#00000000" # backdrop tile behind the logo/spinner; alpha 00 = off
# logo_box_radius = 14.0       # corner radius of that tile (px)
# clock_24h      = true       # 24-hour clock vs 12-hour AM/PM
# fade_ms        = 384.0      # launch fade-in duration (ms)
#
# Expert (Advanced)
# glow_falloff     = 3.2      # night sky-glow tightness (higher = smaller)
# nebula_amount    = 0.12     # night nebula haze (0–0.5)
# comet_tail_decay = 9.0      # sky-comet tail fade rate (higher = shorter)
# spinner_ring     = 0.10     # spinner orbit-ring brightness (0–0.5)

# Auto day/night: the greeter runs before login, so it can't read your KDE color
# scheme — it picks by the local clock instead. The colors above are the NIGHT
# palette; during the day window the built-in Tokyo Night Day (light) palette is
# used, sharing the font/sizes/behavior above. Adjust the window here:
# day_start = "07:00"
# day_end   = "19:00"

# logo = "/usr/share/door/logo.png"   # optional image shown above the fields
