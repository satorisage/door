# door greeter theme — written by door-settings. Edit here or in
# door-settings; keys are documented in the packaged default at
# /usr/share/door/greeter.toml. Colors are "#rrggbb" or "#rrggbbaa".

# wallpaper =   # (none — solid background)
background  = "#0a0014"
card        = "#1a0626cc"
field       = "#2a0e3a"
accent      = "#ff2d95"
foreground  = "#ffd6f5"
muted       = "#b06a9a"
# font =   # (stock)
# logo =
corner_radius = 16
card_width    = 300
show_clock    = true
animate       = true
spinner_glow  = 1
spinner_speed = 2.5
spinner_comet = "#ff5cf0"
spinner_track = "#00e5ff"
spinner_trail = 1
comet_color   = "#ff3df0"

# Sky
glow_color    = "#ff2d95"
sky_glow      = 0.95
star_density  = 1
star_twinkle  = 3.6
comet_enabled = true
comet_interval = 4
cloud_amount  = 2
cloud_speed   = 3.2
# Spinner / card / behavior
spinner_size  = 92
spinner_pulse = 2.6
card_shadow_blur    = 60
card_shadow_opacity = 0.72
accent_breathing = 2.6
field_radius  = 10
error_color   = "#ff5577"
logo_box      = "#00000000"
logo_box_radius = 14
clock_24h     = true
font_weight   = "bold"
fade_ms       = 384
# Expert
glow_falloff  = 2.4
nebula_amount = 0.5
comet_tail_decay = 4.5
spinner_ring  = 0.42
day_start  = "07:00"
day_end    = "19:00"

# Day variant overrides (light). Structural keys (font, sizes,
# behaviour) are shared from above; only colors/assets differ.
[day]
background  = "#ffd9a0"
card        = "#fff0e0aa"
field       = "#ffffffcc"
accent      = "#ff3b00"
foreground  = "#3a1500"
muted       = "#a05a30"
# wallpaper =
# logo =
spinner_glow = 0
spinner_comet = "#ff3b00"
spinner_track = "#ff8a00"
spinner_trail = 0.85
comet_color = "#ff6a00"
glow_color = "#ffcf8a"
sky_glow = 1.1
error_color = "#c01030"
logo_box = "#00000000"
