# door's unprivileged greeter user. No human home, no login shell — it only runs
# the greeter UI. It needs the access the host compositor (cage) requires: DRM via
# the 'video' group and input devices via 'input'. Seat access itself comes from
# the logind session door-greeter.service opens, not from a group.
u door-greeter - "door greeter"
m door-greeter video
m door-greeter input
