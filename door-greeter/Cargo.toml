[package]
name = "door-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "door-greeter"
path = "src/main.rs"

[dependencies]
futures = "0.3"
# `image` enables the wallpaper widget; `canvas` the ambient twinkle layer.
iced = { version = "0.14", features = ["image", "canvas", "svg"] }
iced_futures = "0.14"
protocol = { workspace = true }
# The shared auth-surface kit: theme + styles + host reads (asset vetting, clock,
# indicator probes) — also rendered by door-lock and edited by door-settings.
door-theme = { workspace = true }
