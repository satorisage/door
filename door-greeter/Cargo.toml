[package]
name = "door-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "door-greeter"
path = "src/main.rs"

[dependencies]
futures = "0.3"
# `image` enables the wallpaper background widget.
iced = { version = "0.14", features = ["image"] }
iced_futures = "0.14"
protocol = { workspace = true }
# M4 theming: a config-driven look loaded from a TOML file (admin-controlled,
# world-readable) with a built-in default. serde from the workspace; toml is the
# parser. libc for a dependency-free local clock. Kept minimal — pre-auth surface.
serde = { workspace = true }
toml = "0.8"
libc = { workspace = true }
