[package]
name = "door-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "door-greeter"
path = "src/main.rs"

[dependencies]
futures = "0.3"
# `image` enables the wallpaper widget; `canvas` the ambient twinkle layer.
iced = { version = "0.14", features = ["image", "canvas"] }
iced_futures = "0.14"
protocol = { workspace = true }
# M4 theming lives in the shared door-theme crate (also used by door-settings).
# libc gives a dependency-free local clock. Kept minimal — pre-auth surface.
door-theme = { workspace = true }
libc = { workspace = true }
